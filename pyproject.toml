[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swear-stats"
dynamic = ["version"]
description = "Private, local profanity statistics for Claude Code and Codex CLI histories"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Petrick" }]
dependencies = []

[project.scripts]
swear-stats = "swearstats.cli:main"

# Tools invoked by localPipeline.sh and the release workflow, pinned exactly so
# every machine and CI run checks against the same rule sets and builds the same
# artifacts. Install with: pip install --group dev
[dependency-groups]
dev = [
    "build==1.6.1",
    "mypy==2.4.0",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
]

[tool.setuptools]
packages = ["swearstats", "swearstats.assets", "swearstats.data"]

[tool.setuptools.package-data]
swearstats = ["data/*.tsv", "assets/*.css", "assets/*.js"]

# Single source of truth for the version: swearstats/__init__.py.
[tool.setuptools.dynamic]
version = { attr = "swearstats.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["swearstats", "tests", "scripts"]
