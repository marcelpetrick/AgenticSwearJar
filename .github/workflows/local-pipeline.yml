name: Local Pipeline

on:
  push:
    branches:
      - main
      - master
      - "mpe/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-pipeline:
    name: Local pipeline replica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported interpreter and a current one.
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m pip install .

      - name: Run local pipeline
        run: ./localPipeline.sh
